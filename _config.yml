# Site Settings
lang: pt
title: "ADEFS"
tagline: Assembléia de Deus em Feira de Santana
email: adfeira1@gmail.com
description: >
  A Assembléia de Deus em Feira existe, para glorificar a Deus, estabelecendo crentes e equipando-os na palavra, para fazer discípulos, que se multipliquem, em todo tempo, e em todo lugar.
brand: assets/favicon.svg
baseurl: ""
url: ""
permalink: pretty
#favicon: /assets/favicon.svg
gh_sponsor: 
#hide_share_buttons: true
theme_color: '#000000'
fixed_navbar: top
direction: ltr
#force_theme: light
show_sidebar: false

paginate: 5
paginate_path: "/artigos/page:num"

# Disqus Comments
disqus:
  # Leave shortname blank to disable comments site-wide.
  # Disable comments for any post by adding `comments: false` to that post's YAML Front Matter.
  # shortname: my_disqus_shortname
  shortname: 


plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - kramdown-parser-gfm
  - jekyll-redirect-from

exclude: 
  - Gemfile
  - clean-theme.gemspec
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

livereload: true

sass:
  style: compressed
  source_dir: _sass
  # load_paths: 
    # - node_modules

#google_analytics: UA-code-here
cookie_policy: /cookie-policy/

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      show_sidebar: false
  -
    scope:
      path: ""
      type: "posts"
    values:
      author: "C.S. Rhymes"
      layout: post
      image: https://picsum.photos/id/16/800/600
      show_sidebar: false

markdown: kramdown
highlighter: rouge

footer_menu: example_footer_menu

collections:
  products: 
    output: true
    layout: product
    image: https://picsum.photos/id/16/800/600
    show_sidebar: false

social:
  facebook: https://www.facebook.com/
  instagram: https://www.instagram.com/
  threads: https://www.threads.net/
  tiktok: https://www.tiktok.com/
  x: https://www.x.com/
  youtube: https://www.youtube.com/
  